<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:var(--w); height:var(--h); overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 45% at 50% 105%, rgba(255,120,40,.55), transparent 70%),
      radial-gradient(ellipse 60% 35% at 15% 0%, rgba(120,60,255,.25), transparent 70%),
      linear-gradient(180deg, #07070c 0%, #0d0b14 55%, #1a0f0c 100%);
    font-family: 'Inter Display', 'Inter', sans-serif;
    color:#f4f1ec;
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    padding: 0 var(--pad);
    position:relative;
  }
  body::after { /* grain */
    content:""; position:absolute; inset:0; opacity:.07; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap { margin-top: var(--offset); position:relative; z-index:1; }
  .bar { width: calc(var(--fs) * 1.4); height: calc(var(--fs) * .09); border-radius:99px;
         background:linear-gradient(90deg,#ff7a2f,#ffc24b); margin-bottom: calc(var(--fs) * .9); }
  .q { font-weight:800; font-size:var(--fs); line-height:1.08; letter-spacing:-.03em; }
  .q .soft { font-weight:300; color:rgba(244,241,236,.72); }
  .q .hot { background:linear-gradient(90deg,#ff6a2b 0%,#ffb03b 60%,#ffd56b 100%);
            -webkit-background-clip:text; background-clip:text; color:transparent; }
</style></head>
<body>
  <div class="wrap">
    <div class="bar"></div>
    <div class="q">
      Je fais les plus<br>
      grosses actions<br>
      vers mon succès<br>
      <span class="soft">et c’est ce qui me<br>fait me sentir</span><br>
      <span class="hot">vivant.</span>
    </div>
  </div>
</body></html>
